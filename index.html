<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>สรุปโปรเจกต์ · US Power</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style id="shell-css">
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#152230; --muted:#5B6B7B; --line:#D5DCE3; --accent:#0B6E99; --bad:#C2362B;
  --f-display:"Chakra Petch","Noto Sans Thai",system-ui,sans-serif;
  --f-body:"Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F161D; --panel:#17212B; --ink:#E4EAF0; --muted:#94A3B2; --line:#2A3846; --accent:#4DB3E0; --bad:#EF6B5F; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;min-height:100vh}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.lg-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:6px;padding:28px 26px}
.lg-eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lg-card h1{font-family:var(--f-display);font-size:24px;font-weight:700;margin:2px 0 20px;line-height:1.25}
.lg-card label{display:block;font-size:13px;font-weight:500;margin:14px 0 6px}
.lg-card input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit}
.lg-card input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.lg-btn{width:100%;margin-top:22px;padding:10px;border:0;border-radius:4px;background:var(--accent);color:var(--panel);font:inherit;font-weight:600;cursor:pointer}
.lg-btn:disabled{opacity:.6;cursor:wait}
.lg-err{color:var(--bad);font-size:13px;margin-top:12px;min-height:20px}
.lg-out{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;padding:4px 12px;cursor:pointer;margin-top:6px}
.lg-out:focus-visible,.lg-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gal img:not([src]){background:var(--line)}
</style>
</head>
<body>
<section id="login">
  <form class="lg-card" id="lg-form" autocomplete="on">
    <div class="lg-eyebrow">US Power · Sales Engineering</div>
    <h1>สรุปโปรเจกต์ที่กำลังทำ</h1>
    <label for="lg-u">ชื่อผู้ใช้ (Username)</label>
    <input id="lg-u" name="username" autocomplete="username" required>
    <label for="lg-p">รหัสผ่าน (Password)</label>
    <input id="lg-p" name="password" type="password" autocomplete="current-password" required>
    <button class="lg-btn" id="lg-go" type="submit">เข้าสู่ระบบ</button>
    <div class="lg-err" id="lg-err" role="alert"></div>
  </form>
</section>

const IMG_BASE = "img/";
const SK = "tpp-key";
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => { let s = ""; u.forEach(b => s += String.fromCharCode(b)); return btoa(s); };
let KEY = null;

async function derive(user, pass){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(user + "\n" + pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64d(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function openPayload(key){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(PAYLOAD.iv)}, key, b64d(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* Photos are stored encrypted (12-byte IV + AES-GCM ciphertext) and decrypted on demand. */
const cache = new Map();
function encUrl(path){
  if (!cache.has(path)) cache.set(path, fetch(IMG_BASE + path.replace(/^img\//, "") + ".enc")
    .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(buf => crypto.subtle.decrypt({name:"AES-GCM", iv:new Uint8Array(buf, 0, 12)}, KEY, new Uint8Array(buf, 12)))
    .then(pt => URL.createObjectURL(new Blob([pt], {type:"image/jpeg"}))));
  return cache.get(path);
}
function fill(img){
  const p = img.getAttribute("data-enc"); if (!p) return;
  img.removeAttribute("data-enc");
  encUrl(p).then(u => { img.src = u; }).catch(() => { img.alt = "โหลดรูปไม่สำเร็จ"; });
}
function watchImages(){
  document.querySelectorAll("img[data-enc]").forEach(fill);
  new MutationObserver(ms => ms.forEach(m => {
    if (m.type === "attributes") { if (m.target.hasAttribute("data-enc")) fill(m.target); return; }
    m.addedNodes.forEach(n => { if (n.nodeType !== 1) return;
      if (n.matches("img[data-enc]")) fill(n); n.querySelectorAll && n.querySelectorAll("img[data-enc]").forEach(fill); });
  })).observe(document.body, {subtree:true, childList:true, attributes:true, attributeFilter:["data-enc"]});
}

function logout(){ try { sessionStorage.removeItem(SK); } catch(e) {} location.reload(); }

function mount(page){
  const st = document.createElement("style"); st.textContent = page.css; document.head.appendChild(st);
  document.body.innerHTML = page.html;
  const meta = document.querySelector("header.top .meta");
  if (meta) { const b = document.createElement("button"); b.type = "button"; b.className = "lg-out"; b.textContent = "ออกจากระบบ"; b.onclick = logout; meta.appendChild(document.createElement("br")); meta.appendChild(b); }
  watchImages();
  new Function(page.js)();
}

async function start(key, remember){
  const page = await openPayload(key);
  KEY = key;
  if (remember) { try { sessionStorage.setItem(SK, b64e(new Uint8Array(await crypto.subtle.exportKey("raw", key)))); } catch(e) {} }
  mount(page);
}

(async () => {
  let saved = null; try { saved = sessionStorage.getItem(SK); } catch(e) {}
  if (saved) {
    try { await start(await crypto.subtle.importKey("raw", b64d(saved), "AES-GCM", true, ["decrypt"]), false); return; }
    catch(e) { try { sessionStorage.removeItem(SK); } catch(x) {} }
  }
  document.getElementById("lg-u").focus();
})();

document.getElementById("lg-form").addEventListener("submit", async e => {
  e.preventDefault();
  const go = document.getElementById("lg-go"), err = document.getElementById("lg-err");
  err.textContent = ""; go.disabled = true; go.textContent = "กำลังตรวจสอบ…";
  try {
    await start(await derive(document.getElementById("lg-u").value.trim(), document.getElementById("lg-p").value), true);
  } catch(ex) {
    err.textContent = "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";
    go.disabled = false; go.textContent = "เข้าสู่ระบบ";
  }
});
})();
